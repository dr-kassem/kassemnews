services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kassem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kassem}
      POSTGRES_DB: kassem_news
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kassem -d kassem_news"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Reserved for the optional Celery/worker deployment described in the README.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://kassem:${POSTGRES_PASSWORD:-kassem}@db:5432/kassem_news
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS: http://localhost:3000
      INGESTION_ENABLED: "true"
      INGESTION_INTERVAL_MINUTES: 15
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@kassem.news}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        API_URL: http://backend:8000
        SITE_URL: http://localhost:3000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_URL: http://backend:8000
      SITE_URL: http://localhost:3000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata: